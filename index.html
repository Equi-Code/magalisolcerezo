  <!-- ════════════════════════════════════════════════
       GOOGLE FONTS — fuente ÚNICA de carga
       ════════════════════════════════════════════════
       ⚠️ ANTES había 3 lugares cargando fonts en paralelo:
         1) este <link> (Cormorant sin ital + Quicksand)
         2) @import en src/index.css (Cormorant ital +
            Playfair Display + Quicksand)
         3) @import en src/styles/globals.css (Cormorant
            ital + Quicksand, sin peso 1,600)

       Las 3 descargaban .woff2 EN PARALELO, duplicando/
       triplicando requests → critical path de 1,579ms.

       AHORA: un solo <link>, con:
         · Cormorant Garamond — pesos normal E itálicos
           (300-600). El sitio usa fontStyle:"italic" en
           subtítulos/tags; sin los pesos "ital" reales,
           el browser hacía itálica falsa (texto inclinado
           con CSS) en vez de los glyphs cursivos diseñados.
         · Quicksand — 300 a 700
         · Playfair Display ELIMINADO: en THEME solo
           aparece como fallback ("'Cormorant Garamond',
           'Playfair Display', serif") y casi nunca se
           renderiza si Cormorant carga bien → ahorra
           ~28 KiB de un .woff2 completo.

       ACCIÓN REQUERIDA (fuera de este archivo):
         - Borrar la línea 1 de src/index.css (@import)
         - Borrar la línea 1 de src/styles/globals.css
           (@import) — o el archivo entero si solo
           contiene esa línea.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Quicksand:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
